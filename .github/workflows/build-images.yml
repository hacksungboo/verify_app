# main에 push하면 프론트/백엔드 이미지를 x86_64 + arm64로 빌드해 GHCR에 올린다.
#   ghcr.io/hacksungboo/verify-frontend:latest, :<커밋 7자리>
#   ghcr.io/hacksungboo/verify-backend:latest,  :<커밋 7자리>
# OCI 인스턴스 CPU가 Ampere(ARM)이든 AMD/Intel이든 같은 태그로 받으면 된다.
name: build-images

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/**", ".github/workflows/build-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env: { DATABASE_URL: "sqlite:///./ci.db" }

  build:
    needs: test-backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름 (소문자)
        id: name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/verify-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.short }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            APP_VERSION=0.1.${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
